<!DOCTYPE html>
<html lang="th"> <head>
    <meta charset="UTF-8">
    <title>Esports Tournament</title>
    <link rel="stylesheet" href="style.css">

    <script>
        function welcome(){
            alert("ยินดีต้อนรับสู่การแข่งขัน Esports Tournament");
        }

        function greet(){
            var name = document.getElementById("name").value;
            // ตรวจสอบว่าใส่ชื่อมาหรือยัง
            if(name === "") {
                alert("กรุณากรอกชื่อผู้สมัครด้วยครับ");
            } else {
                document.getElementById("result").innerHTML = "สวัสดี " + name + " ยินดีต้อนรับสู่การแข่งขัน Esports";
            }
        }
    </script>
</head>

<body>
    <div class="container">
        <h1>ESPORTS TOURNAMENT</h1>

        <p class="intro">
            เชิญชวนผู้ที่สนใจเข้าร่วมการแข่งขันอีสปอร์ต เพื่อแสดงความสามารถและสนุกไปกับการแข่งขัน
        </p>

        <img src="https://uploads.onecompiler.io/44dfd5kv9/44g6x5ank/%E0%B8%94%E0%B8%B2%E0%B8%A7%E0%B8%99%E0%B9%8C%E0%B9%82%E0%B8%AB%E0%B8%A5%E0%B8%94.jpg" alt="Tournament Banner" style="max-width:100%;">

        <h2>เกมที่ใช้แข่งขัน</h2>
        <ul>
            <li>Valorant</li>
            <li>League of Legends</li>
            <li>ROV</li>
        </ul>

        <a class="link" href="https://www.twitch.tv" target="_blank">
            ดูการแข่งขัน Esports เพิ่มเติม
        </a>

        <br><br>
        <button onclick="welcome()">แสดงข้อความต้อนรับ</button>

        <br><br>
        <input type="text" id="name" placeholder="กรอกชื่อผู้สมัคร">
        <button onclick="greet()">สมัครแข่งขัน</button>

        <p id="result"></p>
    </div>
</body>
</html>
